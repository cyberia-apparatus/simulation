# The stand the chain simulator builds on: soft3 (tracking main) and the
# sibling revisions soft3 main is built and tested against. soft3's crate
# reaches its siblings by relative path (../../<name>), so the stand is a
# directory holding all of them side by side with this repository.
#
# Source of the revisions: soft3 audit/chain/economy-2026-10-17.md § stand
# (the stand that built soft3 main d7a407e). Several siblings still require
# cyber-hemera "0.3" on their default branches while soft3 needs 0.4; the
# [[bump]] entries are the same one-line stand-local edits the economy
# receipt records (its open item). When the hemera-0.4 sweep lands on the
# default branches, delete the bumps and move the revisions to the
# soft3/release/phase1.toml pins.
#
# `python3 scripts/stand.py --into DIR` builds it (CI); a local task wrapper
# (~/cyber/<repo>/.worktrees/<task>/) holds the same layout.

[soft3]
url = "https://github.com/cyberia-to/soft3"
rev = "main"

